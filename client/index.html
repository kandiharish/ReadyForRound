<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F6FB" />
    <title>ReadyForRound (Ready For Round) · Free AI Mock Interview Platform</title>
    <meta name="description" content="ReadyForRound (Ready For Round) is a 100% free AI mock interview platform. Practise technical, HR and project interview rounds by voice, get honest feedback in minutes and a plan for what to study next." />
    <!-- How the link looks when shared on WhatsApp, LinkedIn, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ReadyForRound · Free AI Mock Interview Platform" />
    <meta property="og:description" content="AI mock interviews that feel like the real thing, with feedback and a study plan. 100% free." />
    <meta property="og:url" content="https://ready-for-round.vercel.app/" />
    <meta property="og:image" content="https://ready-for-round.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:site_name" content="ReadyForRound" />
    <link rel="canonical" href="https://ready-for-round.vercel.app/" />
    <!-- Proves to Google Search Console that we own this site -->
    <meta name="google-site-verification" content="KRiwJq8ft4PTA2infqNb6BUkeERiIsEFeVq0Kbb5EBg" />
    <!-- Structured data: tells Google the site's name, logo and that it's a free app, so search results can show them -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "ReadyForRound",
            "alternateName": ["Ready For Round", "Ready for Round interview", "ReadyForRound AI mock interview platform"],
            "url": "https://ready-for-round.vercel.app/"
          },
          {
            "@type": "Organization",
            "name": "ReadyForRound",
            "url": "https://ready-for-round.vercel.app/",
            "logo": "https://ready-for-round.vercel.app/icon-512.png"
          },
          {
            "@type": "WebApplication",
            "name": "ReadyForRound",
            "url": "https://ready-for-round.vercel.app/",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Any (web browser)",
            "description": "Free AI mock interviews for students, freshers and working professionals: practise technical, project, behavioural and HR rounds by voice, get honest feedback and a study plan.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
          }
        ]
      }
    </script>
    <script>
      // Apply the saved light/dark theme before the page draws, so there's no flash of the wrong colours.
      (function () {
        var theme = null
        try { theme = localStorage.getItem('rfr-theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>ReadyForRound: 100% free AI mock interviews. Please turn on JavaScript to use the app.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
