<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F6FB" />
    <title>ReadyForRound · AI mock interviews for campus placements</title>
    <meta name="description" content="Practise real placement interviews by voice with an AI interviewer. Get honest feedback in minutes and a weekly plan for what to study next. Free for students." />
    <!-- How the link looks when shared on WhatsApp, LinkedIn, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ReadyForRound · Prepare. Practice. Progress." />
    <meta property="og:description" content="AI mock interviews that feel like the real thing, with feedback and a study plan. Free for students." />
    <meta property="og:url" content="https://ready-for-round.vercel.app/" />
    <meta property="og:image" content="https://ready-for-round.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved light/dark theme before the page draws, so there's no flash of the wrong colours.
      (function () {
        var theme = null
        try { theme = localStorage.getItem('rfr-theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
