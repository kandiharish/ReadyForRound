# Keeps the free Render server awake so students don't wait ~25 seconds for it to start.
# Render's free plan sleeps after 15 minutes without requests; this pings it every 10 minutes.
name: Keep server warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl --silent --show-error --max-time 90 --retry 2 https://readyforround.onrender.com/api/ping
